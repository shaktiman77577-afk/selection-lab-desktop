name: Build Windows app

# - Har push par: .exe banta hai, chalakar jaancha jata hai (smoke test), aur
#   Actions -> is run -> Artifacts me "SelectionLab-Windows" milta hai.
# - Tag push (jaise v1.0.1) par: GitHub Release banti hai. Isi Release se
#   sab students ki app apne aap update hoti hai.
#   Naya version: package.json me "version" badlo, commit, phir
#     git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version ($PKG) != tag ($TAG)"; exit 1
          fi

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Smoke test (packaged app starts with fuses + ASAR integrity)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Get-ChildItem "release/win-unpacked" -Filter "*.exe" | Where-Object { $_.Name -notlike "Uninstall*" } | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--sl-smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed: exit $($p.ExitCode)"; exit 1 }
          Write-Host "Smoke test OK"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SelectionLab-Windows
          path: |
            release/*.exe
            release/latest.yml

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
